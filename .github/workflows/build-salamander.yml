name: Build daed (arm64 / armv7 / amd64 + salamander)

# Manually-triggered build that produces FULLY-STATIC linux `daed` binaries
# with hysteria2 salamander obfuscation patched into the outbound dialer.
#
# armv7 (GOARCH=arm GOARM=7) targets 32-bit ARM routers such as the Phicomm K3
# (BCM4709C0, dual Cortex-A9 = ARMv7 with VFPv3). Upstream daed never ships a
# 32-bit ARM asset, but dae-core does (dae-linux-armv7), and daed is pure Go
# with CGO off, so the only thing missing was the matrix entry itself.
# The embedded eBPF is unaffected: control/kern is generated for bpfel,bpfeb
# (endianness, not word size), so the same object serves arm and arm64.
#
# Why fully-static: the target router runs OpenWrt (musl libc). A dynamically
# linked glibc binary will NOT load there. A fully-static binary has no runtime
# libc dependency at all, so it runs on musl and glibc alike — this is exactly
# how the currently-working /usr/bin/daed was built (verified: `file` reports
# "statically linked"). CGO_ENABLED=0 guarantees a static pure-Go binary and
# lets us cross-compile arm64 from a cheap x86 runner with no cross toolchain.
#
# Output: artifact `daed-linux-arm64-salamander`. Download, scp to the router,
# replace /usr/bin/daed, restart the service.

on:
  # Auto-run when this branch is pushed (no API token needed to trigger).
  push:
    branches: [salamander]
  workflow_dispatch:
    inputs:
      outbound_ref:
        description: "olicesx/outbound commit to patch against (must match wing/go.mod)"
        default: "8de5a31bdbe1"
      version:
        description: "VERSION string stamped into the binary"
        default: "salamander"
      luci_ref:
        description: "wkccd/luci-app-daed-runfiles commit to take the LuCI app from"
        default: "6363d2fb9103361435513475ae93fa6fa0bcad38"
      upx:
        description: "Compress the binary with UPX (true/false)"
        default: "true"

permissions:
  contents: write # needed to publish the binary as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest # x86; amd64 builds natively, arm/arm64 cross-compile (CGO off)
    strategy:
      fail-fast: false
      matrix:
        # `name` is the user-facing suffix (daed-linux-<name>); goarch/goarm are
        # what Go actually consumes. Pick the one matching each device.
        include:
          - name: arm64
            goarch: arm64
          - name: armv7 # Phicomm K3 and other Cortex-A8/A9 routers
            goarch: arm
            goarm: "7"
          - name: amd64
            goarch: amd64
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      # Empty for non-arm targets; the Go toolchain treats GOARM="" as unset.
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: "0" # -> fully static, musl-compatible, no cross C toolchain
      GOFLAGS: "-mod=mod" # allow go to reconcile go.mod/go.sum after bumping dae-core
    steps:
      - name: Checkout daed (+ wing, dae-core submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      # Match upstream daed CI: action-setup reads the pnpm version from the
      # package.json "packageManager" field, so do NOT pass a version input
      # (doing so conflicts with packageManager and fails the step).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install eBPF codegen deps (host-side, arch-independent)
        run: sudo apt-get update && sudo apt-get install -y clang llvm libelf-dev make

      - name: Pin dae-core to ab16181 (v0.2.4 = running binary; supports disable_thp)
        run: |
          set -euxo pipefail
          # dae-wing@dc50308 pins dae-core at v0.2.0, which does NOT know the
          # `disable_thp` global config key that the router's stored config uses.
          # The currently-running binary was built with dae-core ab16181 (v0.2.4),
          # which supports it. Match that exactly. This governs BOTH the eBPF
          # build (Makefile compiles from ./dae-core) and the Go code
          # (go.mod: replace dae => ./dae-core), keeping them consistent.
          # dae-core must come from the olicesx fork: commit ab16181 (the core
          # of the running binary, with disable_thp) lives there, NOT on
          # daeuniverse/dae. Module path is still github.com/daeuniverse/dae, so
          # the `replace dae => ./dae-core` in wing/go.mod keeps working.
          rm -rf wing/dae-core
          git clone https://github.com/olicesx/dae.git wing/dae-core
          cd wing/dae-core
          git checkout ab1618181a1c
          git submodule update --init --recursive 2>/dev/null || true
          echo "dae-core now at: $(git rev-parse --short HEAD)"
          grep -n "disable_thp" config/config.go || { echo "disable_thp not found!"; exit 1; }

      - name: Patch outbound with salamander
        run: |
          set -euxo pipefail
          git clone https://github.com/olicesx/outbound.git /tmp/outbound
          cd /tmp/outbound
          git checkout "${{ github.event.inputs.outbound_ref || '8de5a31bdbe1' }}"
          git apply "$GITHUB_WORKSPACE/patches/salamander-outbound-8de5a31.patch"
          # Redirect wing's module graph to the patched local outbound. Overrides
          # the existing `replace ... => olicesx/outbound` and applies to the
          # whole graph (including dae-core).
          cd "$GITHUB_WORKSPACE/wing"
          go mod edit -replace github.com/daeuniverse/outbound=/tmp/outbound

      # Split into granular steps so the failing phase is visible from step
      # status alone (CI logs are not readable without auth).
      - name: "Build phase 1: eBPF + codegen (host-native)"
        run: |
          set -euxo pipefail
          go version; echo "host arch: $(go env GOHOSTARCH); target: $(go env GOARCH)$(go env GOARM)"
          # Must run on the amd64 host: bpf2go / gqlgen are executed via
          # `go run`/`go generate`. Strip cross vars so they don't cross-build.
          cd wing && env -u GOOS -u GOARCH -u GOARM -u CC -u CGO_ENABLED make deps

      - name: "Build phase 2: frontend assets"
        env:
          HUSKY: "0" # don't run git hooks in CI
          NODE_OPTIONS: "--max-old-space-size=6144" # monaco/editor build is memory-hungry
          TURBO_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set -euxo pipefail
          # Replicate `make dist` but with CI-robust flags (avoids frozen-lockfile
          # aborts and husky prepare failures). Produces ./dist at the repo root,
          # which phase 3 embeds via WEB_DIST=../dist.
          pnpm install --no-frozen-lockfile
          pnpm build
          rm -rf dist && cp -r apps/web/dist dist
          ls -la dist | head

      - name: "Build phase 3: static bundle (${{ matrix.name }})"
        run: |
          set -euxo pipefail
          cd wing && make OUTPUT=../daed APPNAME=daed WEB_DIST=../dist \
            VERSION="${{ github.event.inputs.version || 'salamander' }}-$(date +%Y%m%d)" bundle

      - name: Verify the binary is ${{ matrix.name }} AND fully static
        run: |
          set -euxo pipefail
          file ./daed
          # Fail the build if it is not statically linked (would not run on musl).
          case "${{ matrix.name }}" in
            arm64) file ./daed | grep -q "ELF 64-bit" && file ./daed | grep -q "ARM aarch64" ;;
            # 32-bit ARM: `file` reports "ELF 32-bit LSB executable, ARM, EABI5".
            # Assert 32-bit explicitly so an accidental arm64 build can't pass.
            armv7) file ./daed | grep -q "ELF 32-bit" && file ./daed | grep -qE "ARM, EABI" ;;
            amd64) file ./daed | grep -q "x86-64" ;;
          esac
          file ./daed | grep -q "statically linked"
          # Arch-suffixed name so the matrix jobs don't collide.
          cp daed "daed-linux-${{ matrix.name }}"

      # UPX runs AFTER the static-linkage gate (which must see the raw ELF).
      # UPX itself is amd64 and cross-compresses both target arches. daed's
      # embedded eBPF is read from the in-memory image after the UPX loader
      # decompresses it, so packing does not disturb eBPF loading — but this
      # musl-static + eBPF + UPX combo is still verified on the box after deploy.
      - name: Compress with UPX
        if: ${{ (github.event.inputs.upx || 'true') == 'true' }}
        run: |
          set -euxo pipefail
          UPX_VER=4.2.4
          curl -fsSL -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz"
          tar -C /tmp -xf /tmp/upx.tar.xz
          UPX="/tmp/upx-${UPX_VER}-amd64_linux/upx"
          "$UPX" --version | head -1
          BIN="daed-linux-${{ matrix.name }}"
          before=$(stat -c%s "$BIN")
          "$UPX" --best --lzma --no-progress "$BIN"
          after=$(stat -c%s "$BIN")
          echo "UPX: $BIN  $before -> $after bytes ($(( after * 100 / before ))%)"
          file "$BIN"
          # Smoke test: the amd64 packed binary can run on this x86 runner
          # (--version needs no privileges). arm/arm64 are verified on the router.
          if [ "${{ matrix.name }}" = "amd64" ]; then
            chmod +x "$BIN"
            "./$BIN" --version
          fi

      - name: Upload binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: daed-linux-${{ matrix.name }}-salamander
          path: daed-linux-${{ matrix.name }}
          if-no-files-found: error

      - name: Publish binary as a Release asset (public, curl-able)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: salamander-latest
          name: daed + salamander (latest)
          body: Fully-static linux daed with hysteria2 salamander obfuscation (arm64 + armv7 + amd64).
          files: daed-linux-${{ matrix.name }}
          fail_on_unmatched_files: true

  # Wrap each binary into installable OpenWrt packages, the way
  # luci-app-daed-runfiles ships them: procd init script + uci config + the
  # daed binary, with the dependency list opkg/apk needs to pull in
  # kmod-sched-{core,bpf} etc.
  #
  # This repackages rather than rebuilding through the OpenWrt SDK: the
  # binaries are CGO_ENABLED=0 fully-static, so they need no target toolchain
  # and the archive is pure metadata around a file tree.
  #
  # Both package formats are produced because OpenWrt switched package managers:
  # ipk for <= 24.10 (opkg), apk for >= 25.12 (apk-tools 3).
  package:
    name: OpenWrt package (${{ matrix.name }})
    needs: build
    # Per-arch, so a failure in one architecture's build does not withhold the
    # packages for the architectures that did build.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            pkgarch: aarch64_generic
          - name: armv7
            pkgarch: arm_cortex-a9 # bcm53xx / Phicomm K3
          - name: amd64
            pkgarch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ${{ matrix.name }} binary
        uses: actions/download-artifact@v4
        with:
          name: daed-linux-${{ matrix.name }}-salamander
          path: artifact

      - name: Compute package version
        id: ver
        run: |
          set -euxo pipefail
          # apk's version grammar allows digits/dots then -r<n>, so the run
          # number doubles as the package release. Same value feeds both formats.
          echo "version=$(date -u +%Y.%m.%d)-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Fetch luci-app-daed sources and build po2lmo
        run: |
          set -euxo pipefail
          # The LuCI app is not this repository's code; clone it at a pinned
          # commit, the same way this workflow pins outbound and dae-core.
          git clone https://github.com/wkccd/luci-app-daed-runfiles.git /tmp/luci-src
          git -C /tmp/luci-src checkout "${{ github.event.inputs.luci_ref || '6363d2fb9103361435513475ae93fa6fa0bcad38' }}"
          # LuCI ships translations as a binary .lmo catalogue, so the .po has
          # to be compiled. po2lmo is glibc-linked here, which is why staging
          # happens on the runner and only packaging runs inside Alpine.
          packaging/openwrt/build-po2lmo.sh /tmp/po2lmo

      - name: Stage the file trees
        run: |
          set -euxo pipefail
          S=packaging/openwrt/stage.sh
          L=/tmp/luci-src/luci-app-daed
          "$S" daed "artifact/daed-linux-${{ matrix.name }}" stage/daed
          "$S" luci-app "$L" stage/luci-app
          "$S" luci-i18n "$L" /tmp/po2lmo stage/luci-i18n
          find stage -type f | sort

      - name: Build ipk (opkg, OpenWrt <= 24.10)
        env:
          # Fixed epoch keeps ipkg-build's tar timestamps reproducible and
          # sidesteps its locale-dependent `date` parsing.
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y fakeroot
          # OpenWrt's own packaging script, so the archive layout and the
          # Installed-Size/conffiles handling match what opkg expects.
          curl -fsSL -o /tmp/ipkg-build \
            https://raw.githubusercontent.com/openwrt/openwrt/openwrt-24.10/scripts/ipkg-build
          chmod +x /tmp/ipkg-build
          # fakeroot so the archived files are owned by root, not the runner.
          fakeroot env IPKG_BUILD=/tmp/ipkg-build SOURCE_DATE_EPOCH=0 sh -eux packaging/openwrt/build-all.sh \
            ipk "${{ matrix.pkgarch }}" "${{ steps.ver.outputs.version }}" dist-ipk

      - name: Build apk (apk-tools 3, OpenWrt >= 25.12)
        run: |
          set -euxo pipefail
          # Only apk-tools >= 3 can write the ADB-based .apk format. alpine:edge
          # carries 3.0.x; it is an 8MB image versus a ~300MB OpenWrt SDK.
          # Runs as root inside the container, so the payload is chowned to 0:0
          # in a container-local tmpdir rather than on the bind mount.
          docker run --rm -v "$PWD:/w" -w /w alpine:edge sh -eux -c '
            apk --version || true
            sh -eux packaging/openwrt/build-all.sh \
              apk "${{ matrix.pkgarch }}" "${{ steps.ver.outputs.version }}" dist-apk
          '
          # Bind-mounted output is written by the container's root.
          sudo chown -R "$(id -u):$(id -g)" dist-apk

      - name: Fetch v2ray geodata from the OpenWrt feeds
        run: |
          set -euxo pipefail
          # Bundled so the installer works without the router reaching a feed
          # for them; this is what the reference .run archives carry too.
          # Resolve the newest point release of each series rather than pinning
          # a version that will rot.
          latest() {
            curl -fsSL https://downloads.openwrt.org/releases/ \
              | grep -o "href=\"$1\.[0-9]\+/\"" | sed 's/href="//; s|/"||' | sort -V | tail -1
          }
          grab() { # <release> <arch> <ext> <regex> <destdir>
            base="https://downloads.openwrt.org/releases/$1/packages/$2/packages/"
            f=$(curl -fsSL "$base" | grep -o "href=\"$4\"" | sed 's/href="//; s/"//' | sort -V | tail -1)
            [ -n "$f" ] || { echo "not found in $base: $4"; exit 1; }
            curl -fsSL -o "$5/$f" "$base$f"
          }
          R24=$(latest 24.10); R25=$(latest 25.12)
          echo "using OpenWrt $R24 (ipk) and $R25 (apk)"
          # geosite-ir is a different package; require a digit after the dash so
          # it does not shadow plain geosite.
          grab "$R24" "${{ matrix.pkgarch }}" ipk 'v2ray-geoip_[^"]*\.ipk'    dist-ipk
          grab "$R24" "${{ matrix.pkgarch }}" ipk 'v2ray-geosite_[^"]*\.ipk'  dist-ipk
          grab "$R25" "${{ matrix.pkgarch }}" apk 'v2ray-geoip-[0-9][^"]*\.apk'   dist-apk
          grab "$R25" "${{ matrix.pkgarch }}" apk 'v2ray-geosite-[0-9][^"]*\.apk' dist-apk
          ls -la dist-ipk dist-apk

      - name: Inspect the packages
        run: |
          set -euxo pipefail
          IPK=$(ls dist-ipk/daed_*.ipk)
          # `-f -` is required: GNU tar does not default to stdin the way bsdtar does.
          tar xzf "$IPK" -O ./control.tar.gz | tar -xzO -f - ./control
          tar xzf "$IPK" -O ./data.tar.gz | tar -tvz -f -
          # ipkg-build builds data.tar.gz through a pipeline, so a failing tar
          # leaves a near-empty archive without failing the script. Assert the
          # payload really landed instead of shipping a hollow package.
          tar xzf "$IPK" -O ./data.tar.gz | tar -tz -f - | grep -qx './usr/bin/daed'
          size=$(stat -c%s "$IPK")
          echo "ipk size: $size"
          [ "$size" -gt 1000000 ] || { echo "ipk is implausibly small"; exit 1; }
          # The translation catalogue is the one piece with a real build step
          # behind it, so confirm it is non-empty rather than a zero-byte stub.
          LMO=$(ls dist-ipk/luci-i18n-daed-zh-cn_*.ipk)
          tar xzf "$LMO" -O ./data.tar.gz | tar -tvz -f - \
            | grep 'i18n/daed\.zh-cn\.lmo' | awk '{ if ($3 < 100) exit 1 }'
          # Round-trip the apk through apk-tools to prove it is well-formed.
          docker run --rm -v "$PWD:/w" -w /w alpine:edge sh -c \
            'apk adbdump dist-pkg/*.apk | head -40'

      # The end-user artifact: a makeself self-extracting installer, the shape
      # luci-app-daed-runfiles distributes. One per OpenWrt generation, since
      # each has to call a different package manager.
      - name: Build .run self-extracting installers
        run: |
          set -euxo pipefail
          sudo apt-get install -y makeself
          V='${{ steps.ver.outputs.version }}'
          A='${{ matrix.pkgarch }}'
          # Everything the router needs goes inside: daed, the LuCI app and its
          # translation, and the geodata. Only the kmods are left to the feed,
          # since those must match the running kernel exactly and a bundled copy
          # would be wrong more often than right.
          packaging/openwrt/make-runfile.sh --kind ipk \
            --label "daed + salamander $V ($A, OpenWrt <= 24.10)" \
            --out "dist-run/24-daed-salamander_${V}-${A}.run" \
            dist-ipk/*.ipk
          packaging/openwrt/make-runfile.sh --kind apk \
            --label "daed + salamander $V ($A, OpenWrt >= 25.12)" \
            --out "dist-run/25-daed-salamander_${V}-${A}.run" \
            dist-apk/*.apk

      - name: Verify the installers
        run: |
          set -euxo pipefail
          for r in dist-run/*.run; do
            # --list and --check exercise makeself's own header only; neither
            # runs the bundled install.sh.
            sh "$r" --list
            sh "$r" --check
            # Assert the full set made it in, not just install.sh.
            for want in 'install\.sh' 'daed' 'luci-app-daed' 'luci-i18n-daed-zh-cn' 'v2ray-geoip' 'v2ray-geosite'; do
              sh "$r" --list | grep -q "$want" || { echo "$r is missing $want"; exit 1; }
            done
          done
          ls -la dist-run

      # Flatten before upload: upload-artifact roots a multi-path upload at the
      # least common ancestor, which would bury everything one level deeper and
      # break the publish job's glob.
      - name: Collect
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp dist-ipk/* dist-apk/* dist-run/* dist/
          ls -la dist

      - name: Upload packages and installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: daed-openwrt-${{ matrix.pkgarch }}
          path: dist/*
          if-no-files-found: error

  # Single publisher: three matrix jobs pushing assets to the same release tag
  # concurrently race each other in the GitHub API, so collect first, then
  # upload once.
  publish-packages:
    name: Publish OpenWrt packages
    needs: package
    # Not gated on package.result: if one architecture fails, still publish the
    # ones that succeeded. Fails loudly only when nothing at all was produced.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect every architecture's packages
        uses: actions/download-artifact@v4
        with:
          pattern: daed-openwrt-*
          path: pkgs
          merge-multiple: true

      - run: ls -la pkgs

      - name: Publish as Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: salamander-latest
          name: daed + salamander (latest)
          body: Fully-static linux daed with hysteria2 salamander obfuscation (arm64 + armv7 + amd64), plus OpenWrt ipk/apk packages.
          files: pkgs/*
          fail_on_unmatched_files: true

# ---------------------------------------------------------------------------
# Fallback A — if the build fails because some dependency REQUIRES cgo:
#   reproduce the current binary exactly (CGO=1, statically linked against
#   glibc). Use a native arm64 runner and force a static external link:
#     runs-on: ubuntu-24.04-arm
#     env: { GOOS: linux, GOARCH: arm64, CGO_ENABLED: "1" }
#     install: sudo apt-get install -y clang llvm libelf-dev gcc make
#     build:   make daed GO_LDFLAGS='-s -w -extldflags "-static"' \
#                        VERSION=salamander-$(date +%Y%m%d)
#   (glibc static drops NSS/getaddrinfo, but dae uses its own resolver, and the
#    running binary is built this exact way — so it is known-good on this box.)
#
# Fallback B — CGO=1 static cross-compile from x86 with a musl toolchain:
#   install: sudo apt-get install -y musl-tools clang llvm libelf-dev
#   env:     CC=aarch64-linux-musl-gcc (from the musl.cc cross toolchain)
#
# Fallback C — armv7 traps on floating point (SIGILL) on a board whose CPU
#   lacks VFPv3: rebuild that matrix entry with `goarm: "5"`, which makes Go
#   emit software floating point. Slower, but runs on any ARMv5+ core.
#   (Not expected on the K3: its Cortex-A9 has VFPv3-d16.)
#
# NOTE for 32-bit ARM routers: producing the binary is only half the job — the
# kernel has to cooperate. Per dae's docs, binding to LAN *or* WAN needs
# kernel >= 5.17 (>= 5.15 for `dae trace`), plus these config items, which
# embedded distros switch off to save space:
#     CONFIG_BPF{,_SYSCALL,_JIT,_EVENTS,_STREAM_PARSER}=y
#     CONFIG_CGROUPS=y CONFIG_KPROBES=y CONFIG_KPROBE_EVENTS=y
#     CONFIG_NET_INGRESS=y CONFIG_NET_EGRESS=y CONFIG_NET_CLS_ACT=y
#     CONFIG_NET_SCH_INGRESS=m CONFIG_NET_CLS_BPF=m
#     CONFIG_DEBUG_INFO=y CONFIG_DEBUG_INFO_BTF=y
#     # CONFIG_DEBUG_INFO_REDUCED is not set
# When rolling your own OpenWrt, the corresponding menuconfig symbols live
# under Global build settings -> Kernel build options:
#     KERNEL_DEBUG_INFO=y, KERNEL_DEBUG_INFO_BTF=y,
#     KERNEL_DEBUG_INFO_REDUCED=n  <-- defaults to *y*; BTF depends on it
#                                      being off, so it must be unticked first
# Verify on the device: `uname -r`, `ls -l /sys/kernel/btf/vmlinux`, and
#     zcat /proc/config.gz | grep -E 'BTF|BPF|NET_CLS'
# ---------------------------------------------------------------------------
